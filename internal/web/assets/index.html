<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>noobtunnel</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/style.css">
<link rel="stylesheet" href="/custom.css">
</head>
<body>
<div id="app" class="app is-loading">
  <div id="boot" class="boot">
    <div class="boot-mark"></div>
    <p>connecting to the control node…</p>
  </div>
</div>
<div id="toasts" class="toasts" aria-live="polite"></div>

<template id="tpl-home">
  <main class="simple-page">
    <div class="brand brand-lg"><img class="brand-logo" src="/logo" alt=""><span class="brand-text">noobtunnel</span></div>
    <h1>Your private mesh</h1>
    <p class="muted">Connect your devices and reach them securely.</p>
    <div class="row"><a class="btn btn-primary" href="/login">Sign in</a><a class="btn" href="/signup" data-signup-link hidden>Create account</a></div>
  </main>
</template>

<template id="tpl-login">
  <div class="login-wrap">
    <form class="card login" data-form="login">
      <div class="brand brand-lg">
        <img class="brand-logo" src="/logo" alt="">
        <span class="brand-text">noobtunnel</span>
      </div>
      <p class="muted login-sub">Sign in to the control node to manage your mesh.</p>
      <label class="field">
        <span>Username or email</span>
        <input name="username" autocomplete="username" required autofocus>
      </label>
      <label class="field">
        <span>Password</span>
        <input type="password" name="password" autocomplete="current-password" required>
      </label>
      <p class="form-error" data-error hidden></p>
      <button class="btn btn-primary btn-block" type="submit">Sign in</button>
      <div class="row" style="justify-content:space-between"><a href="/">Home</a><a href="/forgot-password">Forgot password?</a></div>
      <p class="muted tiny" data-login-note hidden></p>
    </form>
  </div>
</template>

<template id="tpl-forgot">
  <main class="simple-page"><h1>Reset password</h1>
    <p class="muted">Enter the email linked to your account.</p>
    <form class="stack" data-form="forgot"><label class="field"><span>Email</span><input type="email" name="email" required autocomplete="email"></label>
      <p class="form-error" data-error hidden></p><p class="muted" data-success hidden></p>
      <button class="btn btn-primary" type="submit">Send reset link</button></form><a href="/login">Back to sign in</a>
  </main>
</template>

<template id="tpl-reset">
  <main class="simple-page"><h1>Choose a new password</h1>
    <form class="stack" data-form="reset"><label class="field"><span>New password</span><input type="password" name="password" required minlength="8" autocomplete="new-password"></label>
      <label class="field"><span>Confirm password</span><input type="password" name="confirm" required minlength="8" autocomplete="new-password"></label>
      <p class="form-error" data-error hidden></p><p class="muted" data-success hidden></p>
      <button class="btn btn-primary" type="submit">Reset password</button></form><a href="/login">Back to sign in</a>
  </main>
</template>

<template id="tpl-verify">
  <main class="simple-page"><h1>Confirm email</h1><p class="muted">Confirm this address to activate your account.</p>
    <p class="form-error" data-error hidden></p><p class="muted" data-success hidden></p>
    <button class="btn btn-primary" data-confirm-email>Confirm email</button><a href="/login">Sign in</a>
  </main>
</template>

<template id="tpl-signup">
  <div class="login-wrap"><div class="card login">
    <div class="brand brand-lg"><img class="brand-logo" src="/logo" alt=""><span class="brand-text">noobtunnel</span></div>
    <h1>Create account</h1><p class="muted login-sub">Your account will have its own private mesh.</p>
    <form class="stack" data-form="signup">
      <label class="field"><span>Username</span><input name="username" required minlength="3" maxlength="32" autocomplete="username"></label>
      <label class="field"><span>Email</span><input type="email" name="email" required autocomplete="email"></label>
      <label class="field"><span>Password</span><input type="password" name="password" required minlength="8" autocomplete="new-password"></label>
      <label class="field"><span>Confirm password</span><input type="password" name="confirm" required minlength="8" autocomplete="new-password"></label>
      <p class="form-error" data-error hidden></p>
      <button class="btn btn-primary btn-block" type="submit">Create account</button>
    </form>
    <p class="muted" data-success hidden></p><a href="/login">Sign in</a>
  </div></div>
</template>

<template id="tpl-shell">
  <div class="app-shell" data-app-shell>
  <aside class="sidebar" aria-label="Primary navigation">
    <div class="sidebar-brand brand">
      <img class="brand-logo" src="/logo" alt="">
      <span class="brand-text">noobtunnel</span>
    </div>
    <nav class="sidebar-nav" aria-label="Main">
      <button class="sidebar-link is-active" data-view="overview">Overview</button>
      <button class="sidebar-link" data-view="agents">Agents</button>
      <button class="sidebar-link" data-view="resources">Resources</button>
      <button class="sidebar-link" data-view="domains">Domains</button>
      <button class="sidebar-link" data-view="exitnodes">Exit nodes</button>
      <button class="sidebar-link" data-view="users" data-admin-only hidden>Users</button>
      <button class="sidebar-link has-children" data-view="activity" aria-expanded="false">Logs</button>
      <nav class="sidebar-subnav" data-subnav="activity" aria-label="Logs" hidden>
        <button class="sidebar-sublink is-active" data-tab="requests">Requests</button>
        <button class="sidebar-sublink" data-tab="statistics" data-admin-only>Statistics</button>
        <button class="sidebar-sublink" data-tab="activity" data-admin-only>Activity</button>
        <button class="sidebar-sublink" data-tab="errors">Errors</button>
      </nav>
      <button class="sidebar-link has-children" data-view="settings" data-admin-only aria-expanded="false">Settings</button>
      <nav class="sidebar-subnav" data-subnav="settings" aria-label="Settings" hidden>
        <button class="sidebar-sublink is-active" data-tab="mesh">Mesh &amp; control node</button>
        <button class="sidebar-sublink" data-tab="users">Users</button>
        <button class="sidebar-sublink" data-tab="smtp">SMTP email</button>
        <button class="sidebar-sublink" data-tab="geoip">IP API</button>
        <button class="sidebar-sublink" data-tab="branding">Branding</button>
        <button class="sidebar-sublink" data-tab="tokens">API tokens</button>
      </nav>
    </nav>
  </aside>
  <button class="sidebar-scrim" type="button" data-action="toggle-sidebar" aria-label="Close navigation" hidden></button>
  <div class="main-column">
  <header class="topbar">
    <div class="topbar-left">
      <button class="btn btn-icon sidebar-toggle" type="button" data-action="toggle-sidebar" aria-label="Open navigation">☰</button>
      <div class="page-heading"><span>Control node</span><strong data-current-view>Overview</strong></div>
    </div>
    <div class="topbar-right">
      <div class="menu" data-menu>
        <button class="btn btn-icon" data-action="menu" aria-label="Account menu">⋯</button>
        <div class="menu-pop" hidden>
          <div class="menu-head">
            <div class="menu-title" data-session-user>—</div>
            <div class="menu-sub" data-session-role></div>
          </div>
          <button class="menu-item" data-action="refresh">Refresh state</button>
          <button class="menu-item" data-action="copy-fingerprint">Copy certificate fingerprint</button>
          <button class="menu-item" data-action="change-password">Change my password</button>
          <button class="menu-item danger" data-action="logout">Sign out</button>
        </div>
      </div>
    </div>
  </header>

  <main class="content">
    <section class="view" data-view-panel="overview">
      <div class="stats" data-stats></div>
      <div class="panel" data-health-panel hidden></div>
      <div class="panel panel-topology">
        <div class="panel-head">
          <div>
            <h2>Mesh topology</h2>
            <p class="muted" data-topology-sub></p>
          </div>
          <div class="row" style="flex-wrap:wrap;justify-content:flex-end">
            <span class="chip chip-quiet mono" data-mesh-range></span>
            <div class="legend">
              <span><i class="line line-direct"></i>agent to agent</span>
              <span><i class="line line-relay"></i>via control node</span>
              <span><i class="line line-hub"></i>agent to control node</span>
            </div>
            <button class="btn btn-sm" type="button" data-action="topology-reset">Reset layout</button>
          </div>
        </div>
        <div class="topo" data-topology></div>
      </div>
    </section>

    <section class="view" data-view-panel="agents" hidden>
      <div class="panel">
        <div class="panel-head">
          <div>
            <h2>Agents</h2>
            <p class="muted" data-agents-sub></p>
          </div>
          <div class="row">
            <input class="input" type="search" placeholder="Filter by name, address or key" data-agent-filter>
            <button class="btn btn-primary" data-action="add-agent" data-mesh-manage>Add agent</button>
          </div>
        </div>
        <div class="agent-grid" data-agent-grid></div>
      </div>
    </section>

    <section class="view" data-view-panel="users" hidden>
      <div class="panel">
        <div class="panel-head">
          <div>
            <h2>Users</h2>
            <p class="muted" data-users-sub></p>
          </div>
          <button class="btn btn-primary" data-action="add-user">Add user</button>
        </div>
        <div class="table-wrap" data-users-table></div>
      </div>
    </section>

    <section class="view" data-view-panel="resources" hidden>
      <div class="panel" data-resource-list>
        <div class="panel-head">
          <div>
            <h2>Resources</h2>
            <p class="muted" data-resources-sub></p>
          </div>
          <div class="resource-header-actions">
            <input type="email" data-resource-email-filter aria-label="Filter resources by account email" placeholder="Account email" autocomplete="off" hidden>
            <button class="btn btn-primary" data-action="add-resource" data-resources-add>Add resource</button>
          </div>
        </div>
        <div class="table-wrap" data-resources-table></div>
      </div>
      <div data-resource-editor hidden></div>
    </section>

    <section class="view" data-view-panel="domains" hidden>
      <div class="panel" data-domain-list>
        <div class="panel-head">
          <div>
            <h2>Domains</h2>
            <p class="muted" data-domains-sub></p>
          </div>
          <div class="row">
            <button class="btn" data-action="manage-dns" data-admin-only>Automation</button>
            <button class="btn btn-primary" data-action="add-domain" data-domains-add>Add domain</button>
          </div>
        </div>
        <div class="table-wrap" data-domains-table></div>
      </div>
    </section>

    <section class="view" data-view-panel="exitnodes" hidden>
      <div class="panel" data-exitnode-list>
        <div class="panel-head">
          <div>
            <h2>Exit nodes</h2>
            <p class="muted" data-exitnodes-sub></p>
          </div>
          <button class="btn btn-primary" data-action="add-exitnode" data-exitnodes-add data-admin-only>Add exit node</button>
        </div>
        <div class="table-wrap" data-exitnodes-table></div>
      </div>
    </section>

    <section class="view" data-view-panel="activity" hidden>
      <div class="panel" data-tab-panel="requests">
        <div class="panel-head">
          <div>
            <h2>Requests</h2>
            <p class="muted" data-requests-sub></p>
          </div>
          <div class="row">
            <button class="btn btn-sm" type="button" data-action="requests-clear-filters" data-requests-clear hidden>Clear filters</button>
          </div>
        </div>
        <div class="table-wrap" data-request-table></div>
      </div>
      <div class="panel" data-tab-panel="statistics" hidden>
        <div class="panel-head">
          <div>
            <h2>Statistics</h2>
            <p class="muted">Where the stored traffic came from and which services it used.</p>
          </div>
        </div>
        <div class="charts" data-request-charts></div>
      </div>
      <div class="panel" data-tab-panel="activity" hidden>
        <div class="panel-head">
          <div>
            <h2>Activity</h2>
            <p class="muted">Administrative changes on this control node.</p>
          </div>
        </div>
        <ul class="events" data-events></ul>
      </div>
      <div class="panel" data-tab-panel="errors" hidden>
        <div class="panel-head">
          <div>
            <h2>Errors</h2>
            <p class="muted" data-errors-sub></p>
          </div>
          <button class="btn" data-action="clear-errors" data-admin-only>Clear</button>
        </div>
        <div class="table-wrap" data-errors-table></div>
      </div>
    </section>

<section class="view" data-view-panel="settings" hidden>
  <div class="stack" data-tab-panel="users" hidden>
    <form class="panel" data-form="signup-settings">
      <div class="panel-head"><div><h2>Public sign-up</h2><p class="muted">New accounts receive a private mesh after email confirmation. Unverified accounts are removed after 24 hours.</p></div></div>
      <label class="switch"><input type="checkbox" name="enabled"><span><strong>Allow public signup</strong><em>Turn this off whenever new registrations should stop.</em></span></label>
      <div class="fields">
        <label class="field"><span>Maximum regular users</span><input type="number" name="maxUsers" min="1" max="255" step="1" required></label>
      </div>
      <p class="muted tiny" data-signup-count></p>
      <p class="field-error" data-error hidden></p><div class="panel-foot"><button class="btn btn-primary" type="submit">Save signup settings</button></div>
    </form>
  </div>
  <div class="stack" data-tab-panel="smtp" hidden>
    <form class="panel" data-form="smtp" data-admin-only>
      <div class="panel-head"><div><h2>SMTP email</h2><p class="muted">Send mail through an authenticated TLS connection. Link recipients on the Users page.</p></div><span class="chip" data-smtp-status>not configured</span></div>
      <div class="fields">
        <label class="field"><span>SMTP host</span><input name="host" required placeholder="mail.byenoob.com"></label>
        <label class="field"><span>Port</span><input name="port" type="number" min="1" max="65535" required value="465"></label>
        <label class="field"><span>Security</span><select name="security"><option value="tls">TLS (465)</option><option value="starttls">STARTTLS (587)</option></select></label>
        <label class="field"><span>SMTP username</span><input name="username" required autocomplete="username"></label>
        <label class="field"><span>Password</span><input type="password" name="password" placeholder="Leave blank to keep saved password" autocomplete="new-password"></label>
        <label class="field"><span>From address</span><input type="email" name="from" required></label>
        <label class="field"><span>Test recipient (optional)</span><input type="email" name="testRecipient" placeholder="Send a test when saving"></label>
      </div>
      <div class="field-error" data-smtp-error hidden></div>
      <div class="panel-foot"><button class="btn btn-primary" type="submit">Save SMTP settings</button></div>
    </form>
  </div>
  <div class="grid-2" data-tab-panel="mesh">
  <form class="panel" data-form="settings">
          <div class="panel-head"><h2>Mesh settings</h2></div>
          <div class="fields">
            <label class="field"><span>Mesh name</span><input name="meshName" required></label>
            <label class="field"><span>Mesh address range</span><input name="meshCidr" spellcheck="false"></label>
            <div class="field-error" data-settings-error hidden></div>
            <label class="field"><span>MTU</span><input name="mtu" type="number" min="1280" max="1500"></label>
            <label class="field"><span>WireGuard port (UDP)</span><input name="wgListenPort" type="number" min="1" max="65535"></label>
            <label class="field"><span>Keepalive (seconds)</span><input name="keepaliveSec" type="number" min="0" max="3600"></label>
            <label class="switch">
              <input type="checkbox" name="directPaths">
              <span><strong>Allow direct agent to agent paths</strong>
              <em>Agents try to talk directly and fall back to the hub. Turn this off to relay everything.</em></span>
            </label>
          </div>
          <div class="panel-foot">
            <button class="btn btn-primary" type="submit" data-admin-only>Save settings</button>
            <span class="muted tiny">Changing the address range reassigns addresses.</span>
            <span class="muted tiny" data-readonly-note hidden>Your account is read only, settings cannot be changed.</span>
          </div>
        </form>

  <div class="panel" data-admin-only>
  <div class="panel-head"><h2>Control node</h2></div>
  <dl class="kv" data-server-info></dl>
  </div>
  </div>

  <div class="stack" data-tab-panel="tokens" hidden>
  <div class="panel">
            <div class="panel-head">
              <div><h2>API tokens</h2><p class="muted">Use with <code>Authorization: Bearer …</code> for automation.</p></div>
              <button class="btn" data-action="new-api-token">Create token</button>
            </div>
            <ul class="tokens" data-api-tokens></ul>
          </div>
  </div>

  <div class="stack" data-tab-panel="branding" hidden>
  <form class="panel" data-form="branding" data-admin-only>
            <div class="panel-head"><h2>Branding</h2></div>
            <div class="row" style="gap:14px;align-items:center">
              <img class="brand-logo brand-logo-preview" src="/logo" alt="">
              <label class="field" style="flex:1">
                <span>Logo (PNG, JPEG, WEBP or SVG, up to 2 MB)</span>
                <input type="file" name="logo" accept="image/*">
              </label>
            </div>
            <div class="field-error" data-web-logo-error hidden></div>
            <div class="panel-foot">
              <button class="btn btn-primary" type="submit">Upload logo</button>
              <button class="btn" type="button" data-action="reset-logo">Use default</button>
            </div>
  </form>

  <form class="panel" data-form="brand-name" data-admin-only>
            <div class="panel-head">
              <div><h2>Service name</h2>
              <p class="muted">Used in the header, the page title and on services the control node publishes.</p></div>
            </div>
            <div class="fields">
              <label class="field"><span>Name</span>
                <input name="brandName" maxlength="40" placeholder="noobtunnel" spellcheck="false"></label>
              <div class="field-error" data-brand-error hidden></div>
            </div>
            <div class="panel-foot">
              <button class="btn btn-primary" type="submit">Save name</button>
            </div>
  </form>

  <form class="panel" data-form="brand-css" data-admin-only>
            <div class="panel-head">
              <div><h2>Custom CSS</h2>
              <p class="muted">Added after the built-in stylesheet. Everything below starts as the default theme, edit it and save to restyle the whole UI.</p></div>
              <span class="chip" data-css-status>bundled default</span>
            </div>
            <label class="field">
              <span>Stylesheet</span>
              <textarea name="css" rows="18" spellcheck="false" class="mono" style="white-space:pre;overflow-wrap:normal;overflow-x:auto"></textarea>
            </label>
            <div class="field-error" data-css-error hidden></div>
            <div class="panel-foot">
              <button class="btn btn-primary" type="submit">Save stylesheet</button>
              <button class="btn" type="button" data-action="reload-css">Discard changes</button>
              <button class="btn btn-danger" type="button" data-action="reset-css">Restore default</button>
            </div>
  </form>
  </div>

  <div class="stack" data-tab-panel="geoip" hidden>
  <form class="panel" data-form="geoip" data-admin-only>
            <div class="panel-head">
              <div>
                <h2>Country data</h2>
                <p class="muted">Choose where the control node gets country and IP risk data for resources.</p>
              </div>
              <span class="chip" data-geoip-status>not configured</span>
            </div>
            <div class="fields">
              <div class="geoip-providers" role="radiogroup" aria-label="IP API provider">
                <label class="geoip-provider"><input type="radio" name="provider" value="self" checked><span><strong>Self-hosted iplog</strong><em>Use your own /checkip API through the control node or an agent.</em></span></label>
                <label class="geoip-provider"><input type="radio" name="provider" value="ipapi"><span><strong>Public ipapi.is</strong><em>Fast hosted lookup. Requires an API key; the free account includes 1,000 lookups per day.</em></span></label>
              </div>
              <div data-geoip-self>
                <div class="geoip-endpoint-row">
                  <label class="field"><span>Agent</span><select name="agentId"><option value="0">Control node (direct)</option></select></label>
                  <label class="field"><span>API address</span><input name="host" placeholder="iplog.example.com or http://172.18.0.1:4702" spellcheck="false" autocomplete="off"></label>
                </div>
                <label class="field"><span>iplog API token</span>
                  <input type="password" name="token" placeholder="leave empty to keep the stored token" autocomplete="new-password"></label>
              </div>
              <label class="field" data-geoip-public-token hidden><span>ipapi.is API key</span>
                <input type="password" name="publicToken" placeholder="leave empty to keep the stored key" autocomplete="new-password"></label>
              <label class="switch" data-geoip-fallback hidden>
                <input type="checkbox" name="fallbackEnabled">
                <span><strong>Fall back to iplog</strong>
                  <em data-geoip-fallback-note>Use the saved self-hosted iplog API when ipapi.is cannot answer.</em></span>
              </label>
              <p class="muted tiny" data-geoip-provider-note></p>
              <p class="muted tiny" data-geoip-detail></p>
              <div class="field-error" data-geoip-error hidden></div>
            </div>
            <div class="panel-foot">
              <button class="btn btn-primary" type="submit">Save and check</button>
              <button class="btn" type="button" data-action="geoip-clear">Remove</button>
</div>
</form>
</div>
</section>
  </main>
  </div>
  </div>
</template>

<div id="modal-root"></div>
<script src="/assets/app.js"></script>
<script src="/assets/views.js"></script>
<script src="/assets/users_api.js"></script>
<script src="/assets/resources_api.js"></script>
<script src="/assets/exitnodes_api.js"></script>
<script src="/assets/dns_api.js"></script>
<script src="/assets/branding_api.js"></script>
<script src="/assets/geoip_api.js"></script>
<script src="/assets/smtp_api.js"></script>
<script src="/assets/logs_api.js"></script>
<script src="/assets/diagnose_ui.js"></script>
</body>
</html>
